<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&amp;display=swap');
      .logo-text-m {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 110px;
        font-weight: 700;
      }
    </style>

    <!-- H1 Exact Gold Gradient -->
    <linearGradient id="h1GoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e8bd"/>
      <stop offset="50%" stop-color="#cda75d"/>
      <stop offset="100%" stop-color="#8a6f3a"/>
    </linearGradient>

    <!-- Bevel Drop Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#cda75d" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#h1GoldGrad)" stroke-width="5.5" filter="url(#goldGlow)"/>

  <!-- Inner Ring Accent -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#h1GoldGrad)" stroke-width="1.8" opacity="0.85"/>

  <!-- Center M (Matches H1 font-weight:700 and Cormorant Garamond style) -->
  <text x="100" y="134" 
        class="logo-text-m" 
        text-anchor="middle" 
        fill="url(#h1GoldGrad)" 
        filter="url(#goldGlow)">M</text>
</svg>
